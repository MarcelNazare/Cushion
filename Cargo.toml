[package]
name = "cushion"
version = "0.1.0"
edition = "2021"
description = "Your code's security budget, at a glance."
license = "MIT"
repository = "https://github.com/MarcelNazare/cushion"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
anyhow = "1"
tree-sitter = "0.20"
tree-sitter-python = "0.20"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }